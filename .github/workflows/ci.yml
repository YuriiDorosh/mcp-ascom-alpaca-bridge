# Pre-release: automatic CI on every push/PR is disabled to limit hosted runner spend.
# Run tests locally (`make test-backend-local`, `model-service` Makefile) or trigger this workflow manually in GitHub Actions.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: 1

jobs:
  changes:
    name: Decide what to test
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.merge.outputs.backend }}
      model: ${{ steps.merge.outputs.model }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            model:
              - 'model-service/**'
              - '.github/workflows/ci.yml'

      - id: merge
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ steps.filter.outputs.model }}" >> "$GITHUB_OUTPUT"
          fi

  backend-pytest:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend • pytest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-backend-pypoetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-pypoetry-

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Pytest (unit + integration)
        working-directory: backend
        run: poetry run pytest -q tests/unit tests/integration

  model-pytest:
    needs: changes
    if: needs.changes.outputs.model == 'true'
    name: Model service • pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-model-pypoetry-${{ hashFiles('model-service/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-model-pypoetry-

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install dependencies
        working-directory: model-service
        run: poetry install --no-interaction

      - name: Pytest
        working-directory: model-service
        run: poetry run pytest -q

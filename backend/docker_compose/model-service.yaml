services:
  model-service:
    build:
      context: ../../model-service
      dockerfile: Dockerfile

    environment:
      KAFKA_URL: ${KAFKA_URL:?}
      MODEL_INFERENCE_REQUEST_TOPIC: ${MODEL_INFERENCE_REQUEST_TOPIC:-model-inference-request}
      MODEL_INFERENCE_RESULT_TOPIC: ${MODEL_INFERENCE_RESULT_TOPIC:-model-inference-result}
      MODEL_RUNTIME_PROFILE: ${MODEL_RUNTIME_PROFILE:-cpu}
      MODEL_WORKER_ENABLED: ${MODEL_WORKER_ENABLED:-true}
      MODEL_SERVICE_SOURCE: ${MODEL_SERVICE_SOURCE:-local-model-service}

    ports:
      - "${MODEL_SERVICE_PORT:-8010}:8010"

    depends_on:
      kafka:
        condition: service_healthy

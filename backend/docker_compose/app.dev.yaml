services:
  main-app:
    build:
      context: ..
      dockerfile: Dockerfile

    environment:
      MONGO_DB_CONNECTION_URI: ${MONGO_DB_CONNECTION_URI:?}
      KAFKA_URL: ${KAFKA_URL:?}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-alpaca_astro_center}
      TELESCOPE_OPERATION_TOPIC: ${TELESCOPE_OPERATION_TOPIC:-telescope-operation-events}
      MODEL_INFERENCE_REQUEST_TOPIC: ${MODEL_INFERENCE_REQUEST_TOPIC:-model-inference-request}
      MODEL_INFERENCE_RESULT_TOPIC: ${MODEL_INFERENCE_RESULT_TOPIC:-model-inference-result}
      ALPACA_ENABLED: ${ALPACA_ENABLED:-false}
      ALPACA_ADDRESS: ${ALPACA_ADDRESS:-host.docker.internal:11111}
      ALPACA_DEVICE_NUMBER: ${ALPACA_DEVICE_NUMBER:-0}
      ALPACA_PROTOCOL: ${ALPACA_PROTOCOL:-http}
      ALPACA_CONNECT_TIMEOUT_SECONDS: ${ALPACA_CONNECT_TIMEOUT_SECONDS:-8.0}
      ALPACA_SLEW_TIMEOUT_SECONDS: ${ALPACA_SLEW_TIMEOUT_SECONDS:-420.0}
      ALPACA_SLEW_POLL_INTERVAL_SECONDS: ${ALPACA_SLEW_POLL_INTERVAL_SECONDS:-0.25}
      COMMAND_AUTH_TOKEN: ${COMMAND_AUTH_TOKEN:-}
      CATALOG_LOOKUP_ENABLED: ${CATALOG_LOOKUP_ENABLED:-false}
      CATALOG_RESOLVE_TIMEOUT_SECONDS: ${CATALOG_RESOLVE_TIMEOUT_SECONDS:-20.0}
      EPHEMERIS_ENABLED: ${EPHEMERIS_ENABLED:-false}
      EPHEMERIS_KERNEL: ${EPHEMERIS_KERNEL:-de421.bsp}
      OPERATOR_LIVE_VIEW_IMAGE_URL: ${OPERATOR_LIVE_VIEW_IMAGE_URL:-}
      TELESCOPE_RTSP_URL: ${TELESCOPE_RTSP_URL:-}
      TELESCOPE_RTSP_TRANSPORT_TCP: ${TELESCOPE_RTSP_TRANSPORT_TCP:-true}
      TELESCOPE_RTSP_JPEG_QUALITY: ${TELESCOPE_RTSP_JPEG_QUALITY:-80}

    ports:
      - "${API_PORT}:8000"
      - "${DEBUG_PORT}:5678"

    volumes:
      - ../app/:/app/

    depends_on:
      kafka:
        condition: service_healthy

    command: "debugpy --listen 0.0.0.0:5678 -m uvicorn --factory application.api.main:create_app --timeout-graceful-shutdown 2 --host 0.0.0.0 --port 8000 --reload"
